[project]
name = "internet-weather"
version = "0.1.0"
description = "Technology-intelligence platform observing the AI engineering ecosystem"
requires-python = ">=3.13"

# One Python project covers both `backend/` (the read API) and `workers/`
# (ingestion, detection, retention). They share models and repositories, so a
# single dependency set and a single lockfile is correct — see docs/architecture.md.
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "psycopg[binary]>=3.3.4",
    "alembic>=1.19.1",
    "httpx>=0.28.1",
    "tenacity>=9.1.4",
    "numpy>=2.5.2",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/internetweather", "workers"]

# ── Lint / format ────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["backend/alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle + pyflakes
    "I",            # import sorting
    "UP",           # pyupgrade
    "B",            # bugbear
    "SIM",          # simplify
    "RUF",
]
ignore = [
    # Ambiguous-unicode. The prose in docstrings deliberately uses —, ×, ≤, σ.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency and validation markers belong in defaults by design;
# B008 would flag every route signature in the project.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
]

[tool.ruff.lint.isort]
# `internetweather` is pip-installed into the venv, so ruff would otherwise sort
# it as a third-party package. Both of these are our own code.
known-first-party = ["internetweather", "workers"]

# ── Tests ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]
