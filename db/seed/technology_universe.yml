# Internet Weather — AI Engineering Technology Universe
#
# This file is the EDITORIAL SPINE of the product, not a test fixture.
#
# It defines the curated set of technologies we observe and the high-signal
# repositories that act as sensors for each one. The discovery worker expands
# beyond this seed using each technology's `discovery` block; it never invents
# technologies on its own.
#
# ── Conventions ──────────────────────────────────────────────────────────────
#   slug        Stable public identifier — appears in URLs (/research/<slug>).
#               NEVER rename a slug; retire it instead.
#
#   headline    Receives the one-time curated star-history backfill so the
#               technology has a real trend line on day one.
#               KEEP THIS SET SMALL AND MID-SIZED. Backfill paginates the
#               stargazers API at 100/page, so a 140k-star repo costs ~1,400
#               requests against a 5,000/hour budget. Headline repos are chosen
#               for high momentum at moderate size — where the trend story is
#               both interesting and affordable — not for raw popularity.
#
#   relation    canonical      the reference implementation / specification
#               implementation an independent implementation or major port
#               integration    binds the technology to another ecosystem
#               ecosystem      community tooling, awesome-lists, UIs, docs
#
#   weight      Contribution of this repo to the technology's aggregate signal.
#               Stops a large ecosystem repo from drowning out the spec repo.
#               canonical 1.0 · implementation 0.6 · integration 0.4 · ecosystem 0.25
#
# ── Curation rules ───────────────────────────────────────────────────────────
#   1. One slug = one technology. Do NOT create category buckets such as
#      "vector-databases" — averaging an accelerating and a cooling member
#      produces a meaningless momentum figure.
#   2. Every `full_name` here is verified to resolve on GitHub. Renames are
#      corrected in this file, but the database keys repositories on the
#      immutable GitHub numeric id, because repos get renamed and transferred
#      (9 of the original 140 entries had moved when this seed was written).
#   3. Prefer repos whose activity genuinely reflects the technology's health.

version: 1
domain: ai-engineering
updated: "2026-08-26"

subdomains:
  agentic_ai:
    name: Agentic AI
    description: Agent frameworks, orchestration, tool-use protocols, autonomous workflows.
  llm_ecosystem:
    name: LLMs & Model Ecosystems
    description: Open-weight model families, training and fine-tuning stacks, model libraries.
  rag:
    name: RAG & Knowledge Systems
    description: Retrieval pipelines, vector stores, document processing, retrieval evaluation.
  ai_infra:
    name: AI Infrastructure & Inference
    description: Serving engines, runtimes, gateways, schedulers, local inference.
  multimodal:
    name: Multimodal AI
    description: Speech, vision, image and video generation.
  mlops:
    name: MLOps & Observability
    description: Experiment tracking, tracing, evaluation, model registries, deployment.
  ai_security:
    name: AI Security
    description: Red-teaming, guardrails, prompt-injection defence, model supply chain.

